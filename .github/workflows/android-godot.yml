name: Build Android APK (Godot)

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/android-godot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot 4.7.1 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.1.stable/

      - name: Point Godot at the Android SDK, Java and a debug keystore
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platform-tools" | head -20
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Import and export the APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/godot/android/cocopopo-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: cocopopo
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: cocopopo
        run: |
          cd godot
          ../Godot_v4.7.1-stable_linux.x86_64 --headless --import --path . || true
          # regenerate the art from the drawing scripts in tools/art (deterministic; matches the committed SVGs)
          ../Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://tools/art/export_art_cli.gd
          git status --short art | head -20
          mkdir -p ../release
          ../Godot_v4.7.1-stable_linux.x86_64 --headless --verbose --path . --export-release "Android" ../release/CocoPopo.apk 2>&1 | grep -viE "^\s*$|savepack|Storing File" | tail -80
          ls -la ../release
          test -s ../release/CocoPopo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CocoPopo-apk
          path: release/CocoPopo.apk

      - name: Publish as the "latest" download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cocopopo-latest
          name: CocoPopo (latest Godot build)
          body: "Latest APK built from ${{ github.ref_name }} @ ${{ github.sha }}. Install CocoPopo.apk on Android 5.0+."
          files: release/CocoPopo.apk
          prerelease: false
          make_latest: true
